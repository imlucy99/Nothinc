<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Speedometer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="speedo-container">
        <!-- Minimalist SVG Rings -->
        <svg class="speedo-svg" viewBox="0 0 200 200">
            <!-- Speed Arc (Tengah) -->
            <path class="ring-bg" d="M 40,150 A 72,72 0 1,1 160,150" stroke-width="4"/>
            <path id="speed-bar" class="ring-fill speed-fill" d="M 40,150 A 72,72 0 1,1 160,150" stroke-width="4"/>

            <!-- Engine Outer Arc (Kiri) -->
            <path class="ring-bg" d="M 22,135 A 88,88 0 0,1 60,32" stroke-width="3"/>
            <path id="engine-bar" class="ring-fill" d="M 22,135 A 88,88 0 0,1 60,32" stroke-width="3"/>

            <!-- Fuel Outer Arc (Kanan) -->
            <path class="ring-bg" d="M 140,32 A 88,88 0 0,1 178,135" stroke-width="3"/>
            <path id="fuel-bar" class="ring-fill" d="M 140,32 A 88,88 0 0,1 178,135" stroke-width="3"/>
        </svg>

        <!-- Speed Text Display -->
        <div class="speed-box">
            <span id="speed-val">0</span>
            <span class="speed-unit">KM/H</span>
        </div>

        <!-- Minimalist Icon Indicators -->
        <div class="indicators">
            <div id="icon-headlight" class="icon-item"><i class="fa-solid fa-lightbulb"></i></div>
            <div id="icon-engine" class="icon-item"><i class="fa-solid fa-car-battery"></i></div>
            <div id="icon-lock" class="icon-item"><i class="fa-solid fa-door-closed"></i></div>
            <div id="icon-seatbelt" class="icon-item unbuckled"><i class="fa-solid fa-user-slash"></i></div>
            <div id="icon-fuel" class="icon-item"><i class="fa-solid fa-gas-pump"></i></div>
        </div>
    </div>

    <!-- Audio Element untuk Seatbelt Alarm -->
    <audio id="seatbelt-sound" src="seatbelt.mp3" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
